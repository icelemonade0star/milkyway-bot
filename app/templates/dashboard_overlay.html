<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay Editor</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/dashboard_overlay.css">
</head>
<body>
    <header>
        <div class="topbar">
            <div>
                <h1>채팅 오버레이</h1>
                <div class="channel">{{ channel.channel_name }} · {{ channel.platform_channel_id }}</div>
            </div>
            <nav class="nav">
                <a href="/auth/dashboard">대시보드</a>
                <a href="{{ overlay_url }}" target="_blank" rel="noopener">OBS 화면 열기</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="panel editor-panel">
            <div class="panel-head">
                <h2>스타일 옵션</h2>
            </div>
            <form class="panel-body" id="overlayForm">
                <div class="control-grid">
                    <label>
                        <span>위치</span>
                        <select name="position">
                            <option value="bottom-left">왼쪽 아래</option>
                            <option value="bottom-right">오른쪽 아래</option>
                            <option value="top-left">왼쪽 위</option>
                            <option value="top-right">오른쪽 위</option>
                            <option value="center">가운데</option>
                        </select>
                    </label>
                    <label>
                        <span>말풍선 스타일</span>
                        <select name="bubble_style">
                            <option value="solid">기본</option>
                            <option value="minimal">미니멀</option>
                            <option value="badge">배지형</option>
                        </select>
                    </label>
                    <label>
                        <span>등장 효과</span>
                        <select name="animation">
                            <option value="slide">아래에서</option>
                            <option value="fade">페이드</option>
                            <option value="pop">팝</option>
                            <option value="none">없음</option>
                        </select>
                    </label>
                    <label class="check-control">
                        <input name="show_name" type="checkbox">
                        <span>닉네임 표시</span>
                    </label>
                </div>

                <div class="control-grid">
                    <label>
                        <span>글자 크기</span>
                        <input name="font_size" type="number" min="12" max="48" step="1">
                    </label>
                    <label>
                        <span>최대 너비</span>
                        <input name="max_width" type="number" min="260" max="1400" step="10">
                    </label>
                    <label>
                        <span>화면 여백</span>
                        <input name="padding" type="number" min="0" max="80" step="1">
                    </label>
                    <label>
                        <span>메시지 간격</span>
                        <input name="gap" type="number" min="0" max="32" step="1">
                    </label>
                    <label>
                        <span>안쪽 세로 여백</span>
                        <input name="message_padding_y" type="number" min="0" max="28" step="1">
                    </label>
                    <label>
                        <span>안쪽 가로 여백</span>
                        <input name="message_padding_x" type="number" min="4" max="40" step="1">
                    </label>
                    <label>
                        <span>둥근 정도</span>
                        <input name="radius" type="number" min="0" max="40" step="1">
                    </label>
                    <label>
                        <span>그림자</span>
                        <input name="shadow_strength" type="number" min="0" max="100" step="5">
                    </label>
                    <label>
                        <span>유지 시간(초)</span>
                        <input name="message_ttl_seconds" type="number" min="3" step="1">
                    </label>
                </div>

                <div class="control-grid colors">
                    <label>
                        <span>배경색</span>
                        <input name="background_color" type="color">
                    </label>
                    <label>
                        <span>배경 투명도</span>
                        <input name="background_opacity" type="range" min="0" max="100" step="1">
                    </label>
                    <label>
                        <span>글자색</span>
                        <input name="text_color" type="color">
                    </label>
                    <label>
                        <span>닉네임 색상</span>
                        <input name="name_color" type="color">
                    </label>
                </div>

                <div class="filter-grid">
                    <label>
                        <span>숨길 닉네임</span>
                        <textarea name="blocked_nicknames" spellcheck="false" placeholder="닉네임을 한 줄에 하나씩 입력"></textarea>
                    </label>
                    <fieldset class="role-filter">
                        <legend>숨길 역할</legend>
                        <label class="check-control">
                            <input type="checkbox" name="blocked_roles" value="streamer">
                            <span>스트리머</span>
                        </label>
                        <label class="check-control">
                            <input type="checkbox" name="blocked_roles" value="manager">
                            <span>관리자</span>
                        </label>
                    </fieldset>
                </div>

                <details class="advanced-css">
                    <summary>고급 CSS 직접 편집</summary>
                    <textarea id="customCss" name="custom_css" spellcheck="false">{{ setting.custom_css }}</textarea>
                </details>

                <div class="actions">
                    <button class="primary" type="submit">저장</button>
                    <button type="button" id="resetOptions">옵션 초기화</button>
                    <button type="button" id="refreshPreview">미리보기 새로고침</button>
                    <button class="danger" type="button" id="rotateToken">링크 재발급</button>
                </div>
                <p class="status" id="status"></p>
            </form>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h2>프리셋</h2>
            </div>
            <div class="panel-body">
                <form class="preset-save" id="presetForm">
                    <input id="presetName" name="preset_name" maxlength="80" placeholder="프리셋 이름">
                    <button class="primary" type="submit">현재 스타일 저장</button>
                </form>
                <div class="preset-list" id="presetList"></div>
                <p class="hint">프리셋을 적용해도 OBS 링크는 바뀌지 않습니다. 현재 오버레이 스타일만 교체됩니다.</p>
            </div>
        </section>

        <section class="panel preview-panel">
            <div class="panel-head">
                <h2>미리보기와 링크</h2>
                <div class="mode-tabs" aria-label="preview mode">
                    <button type="button" data-preview-mode="sample" aria-pressed="true">샘플</button>
                    <button type="button" data-preview-mode="live" aria-pressed="false">현재 채팅</button>
                </div>
            </div>
            <div class="panel-body">
                <div class="preview-shell">
                    <iframe id="preview" src="{{ overlay_url }}?preview=1"></iframe>
                </div>
                <div class="link-row">
                    <input id="overlayUrl" value="{{ overlay_url }}" readonly>
                    <button type="button" id="copyUrl">복사</button>
                </div>
                <p class="hint">OBS 브라우저 소스에 이 링크를 넣으면 방송 화면에 채팅이 표시됩니다.</p>
            </div>
        </section>
    </main>

    <script id="overlayStyleMode" type="application/json">{{ style_mode|tojson }}</script>
    <script id="overlayStyleDefaults" type="application/json">{{ base_style_options|tojson }}</script>
    <script id="overlayStyleCurrent" type="application/json">{{ style_options|tojson }}</script>
    <script id="overlayPresetData" type="application/json">{{ presets|tojson }}</script>
    <script src="/static/js/dashboard_overlay.js"></script>
</body>
</html>

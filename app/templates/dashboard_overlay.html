<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay Editor</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/dashboard_overlay.css">
</head>
<body>
    <header>
        <div class="topbar">
            <div>
                <h1>채팅 오버레이</h1>
                <div class="channel">{{ channel.channel_name }} · {{ channel.platform_channel_id }}</div>
            </div>
            <nav class="nav">
                <a href="/auth/dashboard">대시보드</a>
                <a href="{{ overlay_url }}" target="_blank" rel="noopener">OBS 화면 열기</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="panel">
            <div class="panel-head">
                <h2>스타일 편집</h2>
            </div>
            <form class="panel-body" id="overlayForm">
                <label class="toggle">
                    <input id="isActive" name="is_active" type="checkbox" {% if setting.is_active %}checked{% endif %}>
                    오버레이 사용
                </label>
                <textarea id="customCss" name="custom_css" spellcheck="false">{{ setting.custom_css }}</textarea>
                <div class="actions">
                    <button class="primary" type="submit">저장</button>
                    <button type="button" id="refreshPreview">미리보기 새로고침</button>
                    <button class="danger" type="button" id="rotateToken">링크 재발급</button>
                </div>
                <p class="status" id="status"></p>
            </form>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h2>미리보기와 링크</h2>
                <div class="mode-tabs" aria-label="preview mode">
                    <button type="button" data-preview-mode="sample" aria-pressed="true">샘플</button>
                    <button type="button" data-preview-mode="live" aria-pressed="false">현재 채팅</button>
                </div>
            </div>
            <div class="panel-body">
                <div class="preview-shell">
                    <iframe id="preview" src="{{ overlay_url }}?preview=1"></iframe>
                </div>
                <div class="link-row">
                    <input id="overlayUrl" value="{{ overlay_url }}" readonly>
                    <button type="button" id="copyUrl">복사</button>
                </div>
                <p class="hint">OBS 브라우저 소스에 이 링크를 넣으면 방송 화면에 채팅이 표시됩니다.</p>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById("overlayForm");
        const cssInput = document.getElementById("customCss");
        const activeInput = document.getElementById("isActive");
        const statusEl = document.getElementById("status");
        const preview = document.getElementById("preview");
        const overlayUrl = document.getElementById("overlayUrl");
        const modeButtons = document.querySelectorAll("[data-preview-mode]");
        let previewMode = "sample";

        function setStatus(message) {
            statusEl.textContent = message;
        }

        function previewSource() {
            const separator = overlayUrl.value.includes("?") ? "&" : "?";
            if (previewMode === "sample") {
                return `${overlayUrl.value}${separator}preview=1&t=${Date.now()}`;
            }
            return `${overlayUrl.value}${separator}t=${Date.now()}`;
        }

        function refreshPreview() {
            preview.src = previewSource();
        }

        function setPreviewMode(mode) {
            previewMode = mode;
            modeButtons.forEach((button) => {
                button.setAttribute("aria-pressed", String(button.dataset.previewMode === mode));
            });
            refreshPreview();
        }

        async function save() {
            const response = await fetch("/auth/dashboard/overlay", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    custom_css: cssInput.value,
                    is_active: activeInput.checked,
                }),
            });
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.detail || "저장하지 못했습니다.");
            }
            return response.json();
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            try {
                await save();
                setStatus("저장되었습니다.");
                refreshPreview();
            } catch (error) {
                setStatus(error.message);
            }
        });

        document.getElementById("refreshPreview").addEventListener("click", refreshPreview);

        modeButtons.forEach((button) => {
            button.addEventListener("click", () => setPreviewMode(button.dataset.previewMode));
        });

        document.getElementById("copyUrl").addEventListener("click", async () => {
            await navigator.clipboard.writeText(overlayUrl.value);
            setStatus("링크를 복사했습니다.");
        });

        document.getElementById("rotateToken").addEventListener("click", async () => {
            if (!confirm("기존 OBS 링크가 더 이상 동작하지 않습니다. 재발급할까요?")) {
                return;
            }
            try {
                const response = await fetch("/auth/dashboard/overlay/token", {method: "POST"});
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.detail || "링크를 재발급하지 못했습니다.");
                }
                const data = await response.json();
                overlayUrl.value = data.overlay_url;
                setStatus("새 링크가 발급되었습니다.");
                refreshPreview();
            } catch (error) {
                setStatus(error.message);
            }
        });
    </script>
</body>
</html>

<section class="drawing-card drawing-queue" aria-labelledby="drawingQueueHeading">
    <div class="preview-heading"><h2 id="drawingQueueHeading">방송 재생 대기열</h2><button id="refreshDrawingQueue" type="button">새로고침</button></div>
    <p class="help">후원자·금액과 그림을 확인하고 원치 않는 항목을 취소할 수 있어요. 확인창이 열려 있는 동안에는 목록 갱신을 멈춥니다.</p>
    <p id="drawingQueueSummary" class="help"></p>
    <p id="drawingQueueStatus" class="status" role="status" aria-live="polite"></p>
    <p id="drawingQueueEmpty" class="help" hidden>재생 대기 중인 그림이 없어요.</p>
    <ol id="drawingQueueList" class="drawing-queue-list" aria-label="방송 재생 순서"></ol>
    <div class="drawing-queue-pages" id="drawingQueuePages" hidden><button id="previousDrawingQueue" type="button" disabled>이전</button><span id="drawingQueuePage"></span><button id="nextDrawingQueue" type="button" disabled>다음</button></div>
</section>
<dialog id="cancelDrawingQueueDialog" class="cancel-queue-dialog" aria-labelledby="cancelDrawingQueueHeading" aria-describedby="cancelDrawingQueueDescription">
    <form method="dialog">
        <h2 id="cancelDrawingQueueHeading">이 그림의 재생을 취소할까요?</h2>
        <p id="cancelDrawingQueueTarget" class="cancel-queue-target"></p>
        <p id="cancelDrawingQueueTag" class="drawing-queue-tag"></p>
        <p id="cancelDrawingQueueDescription"></p>
        <div class="dialog-actions"><button value="cancel" autofocus>돌아가기</button><button value="confirm" id="confirmCancelDrawingQueue" class="danger">재생 취소 확인</button></div>
    </form>
</dialog>

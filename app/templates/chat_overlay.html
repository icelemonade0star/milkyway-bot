<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ channel.channel_name }} Chat Overlay</title>
    <style>
        {{ setting.custom_css|safe }}
    </style>
</head>
<body>
    <main class="chat-overlay" id="chatOverlay" aria-live="polite"></main>

    <script id="chatOverlayConfig" type="application/json">
        {"token": {{ setting.public_token|tojson }}}
    </script>
    <script src="/static/js/chat_overlay.js"></script>
</body>
</html>

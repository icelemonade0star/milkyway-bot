<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ channel.channel_name }} Chat Overlay</title>
    <style>
        {{ setting.custom_css|safe }}
    </style>
</head>
<body>
    <main class="chat-overlay" id="chatOverlay" aria-live="polite"></main>

    <script>
        const overlay = document.getElementById("chatOverlay");
        const overlayStyle = getComputedStyle(overlay);
        const maxMessages = Number(overlayStyle.getPropertyValue("--overlay-max-messages")) || 20;
        const messageTtlMs = Number(overlayStyle.getPropertyValue("--overlay-message-ttl-ms")) || 16000;
        const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(`${wsProtocol}//${location.host}/overlay/ws/{{ setting.public_token }}`);

        function addMessage(payload) {
            const item = document.createElement("div");
            item.className = "chat-message";

            const name = document.createElement("span");
            name.className = "chat-name";
            name.textContent = payload.nickname || "익명";

            const text = document.createElement("span");
            text.className = "chat-text";
            text.textContent = payload.message || "";

            item.append(name, text);
            overlay.appendChild(item);

            while (overlay.children.length > maxMessages) {
                overlay.firstElementChild.remove();
            }

            window.setTimeout(() => item.remove(), messageTtlMs);
        }

        socket.addEventListener("message", (event) => {
            try {
                addMessage(JSON.parse(event.data));
            } catch (error) {
                console.error(error);
            }
        });

        if (new URLSearchParams(location.search).has("preview")) {
            [
                {nickname: "Milkyway", message: "CSS를 저장하면 이 미리보기에 바로 반영됩니다."},
                {nickname: "Viewer", message: "닉네임 색상, 말풍선, 글자 크기를 자유롭게 바꿔보세요."},
                {nickname: "Streamer", message: "OBS 링크에는 실제 채팅만 표시됩니다."},
            ].forEach((sample, index) => {
                window.setTimeout(() => addMessage(sample), index * 450);
            });
        }
    </script>
</body>
</html>

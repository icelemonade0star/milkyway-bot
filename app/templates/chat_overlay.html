<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ channel.channel_name }} Chat Overlay</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        :where(.chat-overlay) {
            --overlay-message-ttl-ms: {{ overlay_message_ttl_ms }};
            --overlay-name-color-mode: {{ overlay_name_color_mode }};
            --overlay-name-color-palette: {{ overlay_name_color_palette }};
            --overlay-streamer-name-color: #FFD700;
            --overlay-manager-name-color: #FF6B6B;
            width: 100%;
            height: 100%;
        }

        :where(.chat-badge) {
            height: 1em;
            width: auto;
            vertical-align: middle;
            margin-right: 0.2em;
        }

        :where(.chat-emoji) {
            height: 1.4em;
            width: auto;
            vertical-align: middle;
        }

        :where(.chat-frame) {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: inherit;
            align-items: inherit;
            gap: inherit;
        }

        :where(.chat-list) {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: inherit;
            align-items: inherit;
            gap: inherit;
            overflow: hidden;
        }

        :where(.chat-message) {
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        :where(.chat-text) {
            min-width: 0;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        {{ setting.custom_css|safe }}
    </style>
</head>
<body>
    <main class="chat-overlay">
        <section class="chat-frame" aria-live="polite">
            <div class="chat-list" id="chatOverlay"></div>
        </section>
    </main>

    <script id="chatOverlayConfig" type="application/json">
        {"websocket_path": {{ overlay_websocket_path|tojson }}}
    </script>
    <script src="/static/js/chat_overlay.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인증 완료 - Milkyway Bot</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 85%;
            margin: auto;
        }
        h1 { color: #2c3e50; margin-bottom: 16px; font-size: 24px; }
        p { color: #576574; margin-bottom: 32px; line-height: 1.6; font-size: 16px; }
        .channel-name { color: #00c73c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ 인증 성공!</h1>
        <p><span class="channel-name">{{ channel_name }}</span>님, 환영합니다.<br>이제 봇이 정상적으로 연동되었습니다.</p>
    </div>
</body>
</html>

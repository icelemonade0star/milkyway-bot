name: CI Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.get_python_version.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Get Python Version
      id: get_python_version
      run: |
        python_version=$(python scripts/get_python_version.py | jq -r .full)
        echo "version=${python_version}" >> $GITHUB_OUTPUT

  test:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ needs.prepare.outputs.python_version }}

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-anyio requests flake8
        pip install -r requirements-test.txt
        python -m playwright install --with-deps chromium

    - name: Lint with flake8
      run: |
        # 문법 오류(SyntaxError)나 정의되지 않은 변수 등 치명적인 오류만 검사하여 빌드 중단
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check UTF-8 text files
      run: python scripts/check_utf8.py

    - name: Check drawing donation and guide types
      run: >-
        python -m pyright
        app/core/config.py app/db/models.py app/exception_handlers.py
        app/features/chat/handling/events.py app/features/guide/router.py
        app/features/drawing_donation app/lifespan.py app/main.py
        tests/test_drawing_donation.py tests/test_drawing_browser.py tests/test_guide_pages.py

    - name: Run tests
      run: pytest tests/

    - name: Run overlay JavaScript tests
      run: node --test tests/overlay_runtime.test.js

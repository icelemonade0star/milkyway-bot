name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  PYTHON_VERSION: "3.13.9"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.DEPLOY_SHA }}

    # Docker 로그인
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Buildx 설정
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 이미지 빌드 및 푸시
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/milkyway_bot:${{ env.DEPLOY_SHA }}
          ${{ secrets.DOCKERHUB_USERNAME }}/milkyway_bot:latest
        build-args: |
          PYTHON_VERSION=${{ env.PYTHON_VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 개인 서버에 배포
    - name: Deploy to Ubuntu Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: deploy
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        envs: DEPLOY_SHA
        script: |
            cd /app/milkywayBot

            cp .env .env.bak
            git fetch origin
            git reset --hard $DEPLOY_SHA
            mv .env.bak .env

            DEPLOY_SHA=$DEPLOY_SHA docker compose pull
            DEPLOY_SHA=$DEPLOY_SHA docker compose up -d --remove-orphans --wait --wait-timeout 120
            docker image prune -f
